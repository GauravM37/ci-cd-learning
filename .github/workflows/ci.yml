name: Python CI

on:
  push:
  pull_request:
env:
  ENVIRONMENT: testing

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show environment
        run: echo "Environment is $ENVIRONMENT"

      - name: Show branch information
        run: echo "Branch reference is $GITHUB_REF"

      - name: Main branch message
        if: github.ref == 'refs/heads/main'
        run: echo "This is the main branch"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build package
        run: |
          mkdir build
          cp app.py build/
          cp requirements.txt build/
          cd build
          zip -r ../app-package.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app-package.zip

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Show artifact
        run: |
          ls -la
          unzip -l app-package.zip